<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Troque pelo nome e pela frase do site quando o tema for escolhido -->
    <title>Meu site</title>
    <meta name="description" content="Descrição curta do site (aparece no Google e ao compartilhar)." />
    <!-- Sem ícone por enquanto (o "data:," evita um 404 de favicon). Depois: public/favicon.svg -->
    <link rel="icon" href="data:," />
    <!-- Marca que o JavaScript rodou: o CSS só esconde algo para animar se o <html> tiver .js -->
    <script>document.documentElement.classList.add('js')</script>
  </head>
  <body>
    <main id="conteudo">
      <!-- as seções entram aqui (uma <section> por parte do site; o JS de cada uma fica em src/sections/) -->
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
